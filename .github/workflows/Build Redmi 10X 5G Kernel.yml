name: Build Redmi 10X 5G Kernel

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        type: choice
        description: "Device config"
        required: true
        default: atom
        options:
          - atom
          - bomb
      ENABLE_RESUKISU:
        type: boolean
        description: "Enable ReSukiSU"
        required: true
        default: true
      ENABLE_KPM:
        type: boolean
        description: "Enable KPM image patch"
        required: true
        default: true
      ENABLE_SUSFS:
        type: boolean
        description: "Apply external SUSFS kernel-4.14 patches"
        required: true
        default: false
      ENABLE_SECCOMP:
        type: boolean
        description: "Enable seccomp and seccomp filter"
        required: true
        default: true
      FIX_ZERO_WIDTH:
        type: boolean
        description: "Apply zero-width character exec fix"
        required: true
        default: true
      ENABLE_48MP:
        type: boolean
        description: "Enable 48MP capture for OV48B sensor"
        required: true
        default: true
      KERNEL_SOURCE:
        type: string
        description: "Kernel source repository"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
      KERNEL_BRANCH:
        type: string
        description: "Kernel source branch"
        required: true
        default: "bomb-q-oss"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "${{ inputs.DEVICE }} kernel"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_SOURCE }} kernel

      - name: Apply 48MP patch
        if: ${{ inputs.ENABLE_48MP == true }}
        working-directory: kernel
        run: |
          echo "Enabling 48MP capture mode..."
          sed -i 's/capture(image_window, sensor_config_data);/custom4(image_window, sensor_config_data);/' \
            drivers/misc/mediatek/imgsensor/src/common/v1_1/ov48bofilm_mipi_raw/ov48bofilmmipiraw_Sensor.c
          echo "Done"

      - name: Build
        working-directory: kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libssl-dev
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ inputs.DEVICE }}_user_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../kernel_48mp.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel_48mp
          path: kernel_48mp.zip
