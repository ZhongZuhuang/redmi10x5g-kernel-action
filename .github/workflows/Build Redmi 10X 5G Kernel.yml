name: Build Redmi 10X 5G Kernel

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        type: choice
        description: "Device config"
        required: true
        default: atom
        options:
          - atom
          - bomb
      ENABLE_RESUKISU:
        type: boolean
        description: "Enable ReSukiSU"
        required: true
        default: true
      ENABLE_KPM:
        type: boolean
        description: "Enable KPM image patch"
        required: true
        default: true
      ENABLE_48MP:
        type: boolean
        description: "Enable 48MP capture mode for OV48B sensor"
        required: true
        default: true

      ENABLE_SUSFS:
        type: boolean
        description: "Apply external SUSFS kernel-4.14 patches; ReSukiSU already includes SUSFS-side support"
        required: true
        default: false


      ENABLE_SECCOMP:
        type: boolean
        description: "Enable seccomp and seccomp filter"
        required: true
        default: true
      FIX_ZERO_WIDTH:
        type: boolean
        description: "Apply zero-width character exec fix"
        required: true
        default: true
      KERNEL_SOURCE:
        type: string
        description: "Kernel source repository"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
      KERNEL_BRANCH:
        type: string
        description: "Kernel source branch"
        required: true
        default: "bomb-q-oss"
      RESUKISU_REF:
        type: string
        description: "ReSukiSU branch/tag/commit, empty means main"
        required: false
        default: ""
      SUSFS_REF:
        type: string
        description: "susfs4ksu branch for 4.14"
        required: true
        default: "kernel-4.14"
      BUILD_TIME:
        type: string
        description: "KBUILD_BUILD_TIMESTAMP, F means current UTC time"
        required: false
        default: "F"
      KERNEL_SUFFIX:
        type: string
        description: "Local kernel suffix"
        required: false
        default: "-ReSukiSU"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "${{ inputs.DEVICE }} ReSukiSU KPM SUSFS"
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      DEVICE: ${{ inputs.DEVICE }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      KERNEL_SOURCE: ${{ inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
      SUSFS_REF: ${{ inputs.SUSFS_REF }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            bison build-essential ccache curl flex git jq libelf-dev \
            libssl-dev lld llvm make python3 unzip wget zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-redmi10x5g-${{ inputs.DEVICE }}-${{ inputs.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-redmi10x5g-${{ inputs.DEVICE }}-${{ inputs.KERNEL_BRANCH }}-

      - name: Clone kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          echo "Kernel source:"
          git log -1 --oneline
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) = ' Makefile

      - name: Apply 48MP capture patch
        if: ${{ inputs.ENABLE_48MP == true }}
        run: |
          set -euo pipefail
          echo "Applying 48MP capture patch for OV48B sensor..."
          cd kernel
          sed -i 's/capture(image_window, sensor_config_data);/custom4(image_window, sensor_config_data);/' \
            drivers/misc/mediatek/imgsensor/src/common/v1_1/ov48bofilm_mipi_raw/ov48bofilmmipiraw_Sensor.c
          echo "48MP patch applied successfully"

          if [ -n "${{ inputs.RESUKISU_REF }}" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | sh -s "${{ inputs.RESUKISU_REF }}"
          else
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | sh
          fi
          sed -i '/depends on KSU_MANUAL_HOOK/d' KernelSU/kernel/Kconfig || true

      - name: Convert legacy MTK Python scripts
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          def convert(path):
              text = path.read_text()
              text = text.replace(
                  "def usage():\n    print '''",
                  "def usage():\n    print('''",
                  1,
              )
              text = text.replace(
                  "paras        :    parameter for generate wanted file\n'''\n",
                  "paras        :    parameter for generate wanted file\n''')\n",
                  1,
              )
              text = text.replace("except Exception, e:", "except Exception as e:")
              text = re.sub(r"\bcmp\(", "dct_cmp(", text)
              text = re.sub(r"\bstring\.atoi\(", "int(", text)
              text = re.sub(r"^(\s*)print\s+(.+)$", r"\1print(\2)", text, flags=re.M)
              text = text.replace(".keys()[", ".keys_list()[")
              path.write_text(text)

          for path in sorted(Path("tools/dct").rglob("*.py")):
              convert(path)

          drvgen = Path("tools/dct/DrvGen.py")
          text = drvgen.read_text()
          text = text.replace(".keys_list()[", ".keys()[")
          text = text.replace("'''))", "''')")
          text = text.replace(
              "import os, sys\n",
              "import os, sys\n\n"
              "def dct_cmp(a, b):\n"
              "    return (a > b) - (a < b)\n\n",
              1,
          )
          drvgen.write_text(text)

          util = Path("tools/dct/utility/util.py")
          text = util.read_text()
          text = text.replace("import string\n", "")
          util.write_text(text)

          chip = Path("tools/dct/obj/ChipObj.py")
          text = chip.read_text()
          text = text.replace(".keys_list()[", ".keys()[")
          text = text.replace("name = para_map.keys()[idx]", "name = list(para_map.keys())[idx]")
          chip.write_text(text)

          for path in sorted(Path("tools/dct/obj").glob("*.py")):
              text = path.read_text()
              text = re.sub(r"^from ModuleObj import (.+)$", r"from obj.ModuleObj import \1", text, flags=re.M)
              text = re.sub(r"^from (GpioObj|EintObj|AdcObj|ClkObj|I2cObj|PmicObj|Md1EintObj|PowerObj|KpdObj|RfioObj) import (.+)$", r"from obj.\1 import \2", text, flags=re.M)
              text = text.replace("import ChipObj\n", "")
              path.write_text(text)

          for path in sorted(Path("tools/dct/obj").glob("*.py")):
              text = path.read_text()
              if "dct_cmp(" in text and "def dct_cmp(a, b):" not in text:
                  marker = "from utility.util import log\n"
                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + "\n"
                          "def dct_cmp(a, b):\n"
                          "    return (a > b) - (a < b)\n",
                          1,
                      )
                  else:
                      text = (
                          "def dct_cmp(a, b):\n"
                          "    return (a > b) - (a < b)\n\n"
                          + text
                      )
                  path.write_text(text)

          shim = Path("tools/dct/obj/ConfigParser.py")
          shim.write_text(
              "from configparser import *\n"
              "from configparser import ConfigParser as _ConfigParser\n\n"
              "class ConfigParser(_ConfigParser):\n"
              "    def __init__(self, *args, **kwargs):\n"
              "        kwargs.setdefault('strict', False)\n"
              "        super().__init__(*args, **kwargs)\n"
          )

          for path in sorted(Path("tools/dct").rglob("*.py")):
              ast.parse(path.read_text(), filename=str(path))
          PY
          if grep -R -n -E "^\s*print\s+|except .+,\s*[A-Za-z_][A-Za-z0-9_]*:" tools/dct --include='*.py'; then
            echo "MTK DCT scripts still contain Python 2 syntax" >&2
            exit 1
          fi

      - name: Apply SUSFS
        if: ${{ inputs.ENABLE_SUSFS == true }}
        working-directory: kernel
        run: |
          set -euo pipefail
          base="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${SUSFS_REF}/kernel_patches"
          curl -fLSs -o /tmp/50_add_susfs_in_kernel-4.14.patch "$base/50_add_susfs_in_kernel-4.14.patch"
          patch -p1 --forward --reject-file=- < /tmp/50_add_susfs_in_kernel-4.14.patch || true
          mkdir -p fs include/linux
          curl -fLSs -o fs/susfs.c "$base/fs/susfs.c"
          curl -fLSs -o fs/sus_su.c "$base/fs/sus_su.c"
          curl -fLSs -o include/linux/susfs.h "$base/include/linux/susfs.h"
          curl -fLSs -o include/linux/susfs_def.h "$base/include/linux/susfs_def.h"
          curl -fLSs -o include/linux/sus_su.h "$base/include/linux/sus_su.h"
          if [ -d KernelSU ]; then
            curl -fLSs -o /tmp/10_enable_susfs_for_ksu.patch "$base/KernelSU/10_enable_susfs_for_ksu.patch"
            (cd KernelSU && patch -p1 --forward < /tmp/10_enable_susfs_for_ksu.patch) || true
          fi

      - name: Apply zero-width exec fix
        if: ${{ inputs.FIX_ZERO_WIDTH == true }}
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/exec.c")
          text = path.read_text()
          helper = r'''

          static bool is_zero_width_utf8(const unsigned char *s, int left, int *skip)
          {
          	if (left >= 3 && s[0] == 0xe2 && s[1] == 0x80 &&
          	    (s[2] == 0x8b || s[2] == 0x8c || s[2] == 0x8d ||
          	     s[2] == 0x8e || s[2] == 0x8f)) {
          		*skip = 3;
          		return true;
          	}

          	if (left >= 3 && s[0] == 0xef && s[1] == 0xbb && s[2] == 0xbf) {
          		*skip = 3;
          		return true;
          	}

          	if (left >= 4 && s[0] == 0xf3 && s[1] == 0xa0 &&
          	    s[2] == 0x80 && s[3] == 0x80) {
          		*skip = 4;
          		return true;
          	}

          	return false;
          }

          static int sanitized_user_arg_len(const char __user *str, int *out_len)
          {
          	char *buf;
          	long len;
          	int i, skip;

          	len = strnlen_user(str, MAX_ARG_STRLEN);
          	if (!len)
          		return -EFAULT;
          	if (len > MAX_ARG_STRLEN)
          		return -E2BIG;

          	buf = memdup_user(str, len);
          	if (IS_ERR(buf))
          		return PTR_ERR(buf);

          	for (i = 0; i < len - 1; i += skip) {
          		skip = 1;
          		if (is_zero_width_utf8(buf + i, len - 1 - i, &skip)) {
          			kfree(buf);
          			return -EACCES;
          		}
          	}

          	kfree(buf);
          	*out_len = len;
          	return 0;
          }
          '''
          if "sanitized_user_arg_len" not in text:
          	marker = "\n/*\n * count() counts the number of strings in array ARGV.\n */"
          	if marker not in text:
          		raise SystemExit("exec.c marker for zero-width helper not found")
          	text = text.replace(marker, helper + marker, 1)

          old = """		len = strnlen_user(str, MAX_ARG_STRLEN);
          		if (!len)
          			goto out;
          """
          new = """		ret = sanitized_user_arg_len(str, &len);
          		if (ret)
          			goto out;
          """
          if old in text:
          	text = text.replace(old, new, 1)
          elif "ret = sanitized_user_arg_len(str, &len);" not in text:
          	raise SystemExit("copy_strings strlen block not found")

          path.write_text(text)
          PY

      - name: Apply ReSukiSU manual hooks
        if: ${{ inputs.ENABLE_RESUKISU == true }}
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch_file(rel, replacements):
              path = Path(rel)
              text = path.read_text()
              for old, new in replacements:
                  if new.strip() in text:
                      continue
                  if old not in text:
                      raise SystemExit(f"{rel}: hook anchor not found: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch_file("fs/exec.c", [
              (
                  "#include <linux/vmalloc.h>\n",
                  "#include <linux/vmalloc.h>\n#include <linux/kallsyms.h>\n\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\t      void *argv, void *envp, int *flags);\n",
              ),
              (
                  "\tretval = bprm_mm_init(bprm);\n",
                  "\tretval = ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "\tif (retval)\n"
                  "\t\tgoto out_unmark;\n\n"
                  "\tretval = bprm_mm_init(bprm);\n",
              ),
          ])

          patch_file("fs/open.c", [
              (
                  "#include <linux/ima.h>\n",
                  "#include <linux/ima.h>\n#include <linux/kallsyms.h>\n\n"
                  "extern int ksu_handle_faccessat(int *dfd,\n"
                  "\t\t\t\t      const char __user **filename_user,\n"
                  "\t\t\t\t      int *mode, int *__unused_flags);\n",
              ),
              (
                  "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */\n"
                  "\t\treturn -EINVAL;\n",
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\n"
                  "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */\n"
                  "\t\treturn -EINVAL;\n",
              ),
          ])

          patch_file("fs/stat.c", [
              (
                  "#include <linux/syscalls.h>\n",
                  "#include <linux/syscalls.h>\n#include <linux/kallsyms.h>\n\n"
                  "extern int ksu_handle_stat(int *dfd,\n"
                  "\t\t\t\t   const char __user **filename_user, int *flags);\n"
                  "extern void ksu_handle_newfstat_ret(unsigned int *fd,\n"
                  "\t\t\t\t\t    struct stat __user **statbuf_ptr);\n"
                  "extern void ksu_handle_fstat64_ret(unsigned long *fd,\n"
                  "\t\t\t\t\t   struct stat64 __user **statbuf_ptr);\n",
              ),
              (
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n",
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n",
              ),
              (
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(readlinkat",
                  "\tif (!error) {\n"
                  "\t\terror = cp_new_stat(&stat, statbuf);\n"
                  "\t\tif (!error)\n"
                  "\t\t\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                  "\t}\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(readlinkat",
              ),
              (
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat64(&stat, statbuf);\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(fstatat64",
                  "\tif (!error) {\n"
                  "\t\terror = cp_new_stat64(&stat, statbuf);\n"
                  "\t\tif (!error)\n"
                  "\t\t\tksu_handle_fstat64_ret(&fd, &statbuf);\n"
                  "\t}\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(fstatat64",
              ),
          ])

          patch_file("kernel/reboot.c", [
              (
                  "#include <linux/uaccess.h>\n",
                  "#include <linux/uaccess.h>\n#include <linux/kallsyms.h>\n\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2,\n"
                  "\t\t\t\t     unsigned int cmd, void __user **arg);\n",
              ),
              (
                  "\tchar buffer[256];\n"
                  "\tint ret = 0;\n\n",
                  "\tchar buffer[256];\n"
                  "\tint ret = 0;\n\n"
                  "\tret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "\tif (!ret)\n"
                  "\t\treturn ret;\n\n",
              ),
          ])

          selinux_hide = Path("KernelSU/kernel/feature/selinux_hide.c")
          if selinux_hide.exists():
              text = selinux_hide.read_text()
              old = (
                  "/*\n"
                  " * get the subjective security ID of the current task\n"
                  " */\n"
                  "static inline u32 current_sid(void)\n"
                  "{\n"
                  "    const struct task_security_struct *tsec = current_security();\n"
                  "\n"
                  "    return tsec->sid;\n"
                  "}\n"
                  "\n"
              )
              if old in text:
                  text = text.replace(old, "", 1)
                  selinux_hide.write_text(text)

          string_c = Path("lib/string.c")
          text = string_c.read_text()
          if "char *stpcpy(char *dest, const char *src)" not in text:
              anchor = "#ifndef __HAVE_ARCH_STRNCPY\n"
              impl = (
                  "#ifndef __HAVE_ARCH_STPCPY\n"
                  "char *stpcpy(char *dest, const char *src)\n"
                  "{\n"
                  "\twhile ((*dest = *src) != '\\0') {\n"
                  "\t\tdest++;\n"
                  "\t\tsrc++;\n"
                  "\t}\n"
                  "\treturn dest;\n"
                  "}\n"
                  "EXPORT_SYMBOL(stpcpy);\n"
                  "#endif\n"
                  "\n"
              )
              if anchor not in text:
                  raise SystemExit("lib/string.c stpcpy anchor not found")
              text = text.replace(anchor, impl + anchor, 1)
              string_c.write_text(text)
          PY

      - name: Apply clang compatibility fixes
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("mm/rmap.c")
          text = path.read_text()
          text = text.replace(
              "enum ttu_flags flags = (enum ttu_flags)arg;",
              "enum ttu_flags flags = (enum ttu_flags)(unsigned long)arg;",
          )
          path.write_text(text)

          path = Path("drivers/input/touchscreen/focaltech_touch/focaltech_config.h")
          if path.exists():
              text = path.read_text()
              text = text.replace(
                  "#define FTS_AUTO_UPGRADE_EN                     1",
                  "#define FTS_AUTO_UPGRADE_EN                     0",
              )
              path.write_text(text)

          for rel in (
              "drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i",
              "drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i",
              "drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i",
          ):
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              if not path.exists():
                  path.write_text("0x00\n")
          PY

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/toolchains/gcc-arm64/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm/bin:$PATH"
          export PYTHONPATH="$PWD/tools/dct:$PWD/tools/dct/obj:$PWD/tools/dct/utility:${PYTHONPATH:-}"
          CLANG="$GITHUB_WORKSPACE/toolchains/proton-clang/bin/clang"
          LLD="$GITHUB_WORKSPACE/toolchains/proton-clang/bin/ld.lld"
          export KBUILD_BUILD_USER=suhuli
          export KBUILD_BUILD_HOST=github-actions
          if [ "${{ inputs.BUILD_TIME }}" = "F" ] || [ -z "${{ inputs.BUILD_TIME }}" ]; then
            export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC date '+%a %b %d %T %Z %Y')"
          else
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.BUILD_TIME }}"
          fi

          if [ "$DEVICE" = "bomb" ]; then
            DEFCONFIG="bomb_user_defconfig"
          else
            DEFCONFIG="atom_user_defconfig"
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          make O=out \
            ARCH=arm64 \
            python=python3 \
            CC="$CLANG" \
            HOSTCC="gcc" \
            HOSTCXX="g++" \
            HOSTLD="/usr/bin/ld" \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            LD="$LLD" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=void-pointer-to-enum-cast" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

          scripts/config --file out/.config -e KALLSYMS -e KALLSYMS_ALL -d KALLSYMS_BASE_RELATIVE
          if [ "${{ inputs.ENABLE_RESUKISU }}" = "true" ]; then
            scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK
            scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK || true
          fi
          if [ "${{ inputs.ENABLE_KPM }}" = "true" ]; then
            scripts/config --file out/.config -e KPM
          fi
          if [ "${{ inputs.ENABLE_SUSFS }}" = "true" ]; then
            scripts/config --file out/.config -d KSU_SUSFS || true
            scripts/config --file out/.config -d KSU_SUSFS_SUS_SU || true
            scripts/config --file out/.config -e TMPFS_XATTR -e TMPFS_POSIX_ACL || true
          fi
          if [ "${{ inputs.ENABLE_SECCOMP }}" = "true" ]; then
            scripts/config --file out/.config -e SECCOMP -e SECCOMP_FILTER
          fi
          scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG -d CC_STACKPROTECTOR_REGULAR -e CC_STACKPROTECTOR_NONE || true
          if [ -n "${{ inputs.KERNEL_SUFFIX }}" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "${{ inputs.KERNEL_SUFFIX }}"
            scripts/config --file out/.config -d LOCALVERSION_AUTO
          fi
          make O=out ARCH=arm64 python=python3 olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/toolchains/gcc-arm64/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm/bin:$PATH"
          export PYTHONPATH="$PWD/tools/dct:$PWD/tools/dct/obj:$PWD/tools/dct/utility:${PYTHONPATH:-}"
          CLANG="$GITHUB_WORKSPACE/toolchains/proton-clang/bin/clang"
          LLD="$GITHUB_WORKSPACE/toolchains/proton-clang/bin/ld.lld"
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            python=python3 \
            CC="$CLANG" \
            HOSTCC="gcc" \
            HOSTCXX="g++" \
            HOSTLD="/usr/bin/ld" \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            LD="$LLD" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=void-pointer-to-enum-cast" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs
          ccache -s

      - name: Collect image
        run: |
          set -euo pipefail
          mkdir -p out
          image=""
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            size="$(stat -c%s kernel/out/arch/arm64/boot/Image.gz-dtb)"
            if [ "$size" -lt 1048576 ]; then
              echo "Image.gz-dtb is unexpectedly small; ignoring it and using raw Image/Image.gz."
              rm -f kernel/out/arch/arm64/boot/Image.gz-dtb
            fi
          fi
          for candidate in \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            kernel/out/arch/arm64/boot/Image.gz \
            kernel/out/arch/arm64/boot/Image; do
            if [ -f "$candidate" ]; then
              image="$candidate"
              break
            fi
          done
          if [ -z "$image" ]; then
            echo "No kernel image found" >&2
            find kernel/out/arch/arm64/boot -maxdepth 2 -type f | sort || true
            exit 1
          fi
          cp "$image" out/Image
          echo "IMAGE_PATH=$image" >> "$GITHUB_ENV"

      - name: Apply KPM
        if: ${{ inputs.ENABLE_KPM == true }}
        run: |
          set -euo pipefail
          if [ ! -f patches/patch_linux ]; then
            git checkout -- patches/patch_linux patches/kpimg-linux patches/kptools-linux || true
          fi
          if [ -f patches/patch_linux ]; then
            cp patches/patch_linux out/patch_linux
            chmod +x out/patch_linux
            cd out
            ./patch_linux || {
              echo "KPM image patch failed; keeping CONFIG_KPM kernel image."
              exit 0
            }
            if [ -f oImage ]; then
              mv -f oImage Image
            fi
          else
            echo "patches/patch_linux is missing; keeping CONFIG_KPM kernel image."
          fi

      - name: Pack AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp out/Image AnyKernel3/Image
          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          properties() {
            kernel.string=Redmi 10X 5G ReSukiSU Kernel by suhuli
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=atom
            device.name2=bomb
            supported.versions=
            supported.patchlevels=
          }
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
          chmod +x AnyKernel3/anykernel.sh
          ZIP_NAME="AnyKernel3_ReSukiSU_Redmi10X5G_${DEVICE}_${GITHUB_RUN_NUMBER}.zip"
          (cd AnyKernel3 && zip -r "../$ZIP_NAME" ./*)
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.DEVICE }}-${{ github.run_number }}
          path: |
            kernel/out/.config
            kernel/out/include/config/kernel.release
            kernel/out/arch/arm64/boot/Image*
          if-no-files-found: ignore
