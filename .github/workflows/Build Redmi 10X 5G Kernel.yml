name: Build Minimal 48MP Kernel

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        type: choice
        options:
          - atom
        description: "Device config"
        required: true
        default: atom

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: "Build 48MP kernel"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libssl-dev

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch bomb-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Apply 48MP patch
        working-directory: kernel
        run: |
          echo "Applying 48MP capture patch..."
          SENSOR_FILE="drivers/misc/mediatek/imgsensor/src/common/v1_1/ov48bofilm_mipi_raw/ov48bofilmmipiraw_Sensor.c"
          # Replace capture with custom4
          sed -i 's/capture(image_window, sensor_config_data);/custom4(image_window, sensor_config_data);/' "$SENSOR_FILE"
          # Comment out unused capture function
          sed -i '/^static kal_uint32 capture(/,/^}/s/^/\/\//' "$SENSOR_FILE"
          # Comment out unused capture_setting function
          sed -i '/^static void capture_setting(/,/^}/s/^/\/\//' "$SENSOR_FILE"
          echo "48MP patch applied"
          # Verify
          grep -n "custom4\|capture" "$SENSOR_FILE" | grep -A1 -B1 "CAPTURE" | head -10

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make atom_user_defconfig
          make -j$(nproc) KCFLAGS="-w -Wno-error"

      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../kernel_48mp_minimal.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel_48mp_minimal
          path: kernel_48mp_minimal.zip
